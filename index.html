function current(){if(main==='国外')return foreign.filter(x=>kind==='全部'||x.层级===kind);if(kind==='国家标准'||kind==='行业标准'||kind==='团体标准')return standards.filter(x=>x.类别===kind);if(kind==='行政法规等')return admin;if(kind==='企业标准')return enterprise.map(x=>({类别:'企业标准',用途分类:x[0],标准编号:'待按企业核验',标准名称:x[1],状态:'待核验',选用重点:x[2],注意事项:x[3],官方来源:'https://www.qybz.org.cn/'}));return standards}
function render(){let data=current(),q=$('q').value.trim().toLowerCase(),st=$('status').value,cat=$('cat').value;data=data.filter(x=>{let txt=Object.values(x).join(' ').toLowerCase();return(!q||txt.includes(q))&&(!st||x.状态===st)&&(!cat||x.用途分类===cat)});$('stats').innerHTML=`<div class="stat"><b>${data.length}</b><small>当前结果</small></div><div class="stat"><b>${main==='国内'?standards.length+admin.length+enterprise.length:foreign.length}</b><small>${main}目录记录</small></div><div class="stat"><b>${main==='国内'?'国标/行标/团标/企标/行政':'国际组织/地区/国家'}</b><small>分类视图</small></div>`;$('note').textContent=main==='国内'?(kind==='企业标准'?'企标无法按“化妆品”单一关键词穷尽，需用企业法定全称、统一社会信用代码和产品名称检索。':'国标、行标、团标、企标和行政法规的法律属性不同；标准目录不等于全文。'):'国外按国际组织、地区和国家分组，详情链接指向相应官方机构。';let cols=main==='国内'?['类别','用途分类','标准编号','标准名称','状态','发布日期','实施日期','发布或主管单位','选用重点','来源']:['层级','地区','编号','名称','主题','内容','来源'];$('thead').innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('');$('tbody').innerHTML=data.map(x=>{let vals=main==='国内'?[x.类别||x.层级,x.用途分类,x.标准编号,x.标准名称,x.状态,x.发布日期||'',x.实施日期||'',x.发布或主管单位||'',(x.选用重点||x.内容||'')+(x.全文状态?'｜全文状态：'+x.全文状态:''),x.官方来源||x.来源]:[x.层级,x.地区,x.编号,x.名称,x.主题,x.内容,x.来源];return '<tr>'+vals.map((v,i)=>{if(i===4&&main==='国内'&&x.状态)return `<td><span class="badge ${esc(x.状态)}">${esc(v)}</span></td>`;if((main==='国内'&&i===9)||(main==='国外'&&i===6))return `<td>${link(v,'官方入口')}</td>`;return `<td>${esc(v)}</td>`}).join('')+'</tr>'}).join('');$('empty').classList.toggle('hidden',!data.length);}
function setMain(v){main=v;kind='全部';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.main===v));$('domestic').classList.toggle('hidden',v!=='国内');$('foreign').classList.toggle('hidden',v!=='国外');$('status').classList.toggle('hidden',v==='国外');$('cat').classList.toggle('hidden',v==='国外');setKinds();render()}function setKinds(){document.querySelectorAll('.subtab').forEach(b=>b.classList.toggle('active',b.dataset.kind===kind))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMain(b.dataset.main));document.querySelectorAll('.subtab').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;setKinds();render()});['q','status','cat'].forEach(id=>$(id).oninput=render);$('clear').onclick=()=>{$('q').value='';$('status').value='';$('cat').value='';render()};[...new Set(standards.map(x=>x.用途分类))].sort().forEach(x=>{let o=document.createElement('option');o.textContent=o.value=x;$('cat').append(o)});render();
</script></body></html>
